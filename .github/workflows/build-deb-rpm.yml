name: build-deb-rpm

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag/ref to build (empty = latest OrcaSlicer release)"
        default: ""
      force:
        description: "Rebuild even if a release for that ref already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-linux
  cancel-in-progress: false

env:
  UPSTREAM_REPO: OrcaSlicer/OrcaSlicer
  NFPM_VERSION: "2.49.0"
  ICON_SIZES: "16 24 32 48 64 128 256 512"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Resolve upstream ref
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$(gh api "repos/${UPSTREAM_REPO}/releases/latest" -q .tag_name)}"
          if [ -z "$ref" ]; then
            echo "::error::could not resolve an upstream ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && gh release view "$ref" >/dev/null 2>&1; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Release $ref already exists — set force=true to rebuild."
          fi

      - name: Checkout packaging repo
        if: env.SKIP != 'true'
        uses: actions/checkout@v4

      - name: Checkout upstream at ref
        if: env.SKIP != 'true'
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: git clone --depth 1 --branch "$REF" "https://github.com/${UPSTREAM_REPO}.git" upstream

      - name: Install build dependencies
        if: env.SKIP != 'true'
        working-directory: upstream
        run: sudo ./build_linux.sh -ur

      - name: Build deps and slicer
        if: env.SKIP != 'true'
        working-directory: upstream
        # -d deps, -s slicer, -r skip RAM/disk preflight, -l clang, -L ld.lld
        # same flags upstream CI uses, minus the AppImage (-i) and tests (-t)
        run: ./build_linux.sh -dsrlL

      - name: Audit bundled libraries
        if: env.SKIP != 'true'
        working-directory: upstream
        run: ./scripts/check_appimage_libs.sh ./build/package ./build/package/bin/orca-slicer

      - name: Stage icons and desktop metadata
        if: env.SKIP != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick
          for size in $ICON_SIZES; do
            mkdir -p ".pkg-stage/icons/hicolor/${size}x${size}/apps"
            convert resources/images/OrcaSlicer.png -resize "${size}x${size}" \
              ".pkg-stage/icons/hicolor/${size}x${size}/apps/OrcaSlicer.png"
          done
          find .pkg-stage -name '*.png' | sort

      - name: Normalize file modes
        if: env.SKIP != 'true'
        working-directory: upstream
        # upstream chmods the launcher ug+x (0754), which is fine inside an AppImage
        # (owned by whoever runs it) but not once installed as root:root: the user
        # is neither owner nor group, so the o+x bit is what makes it start.
        run: |
          set -euo pipefail
          find build/package -type f -perm -u+x ! -perm -o+x -exec chmod o+x {} +
          chmod 0755 build/package/orca-slicer build/package/libexec/orca-slicer-env
          find build/package -maxdepth 1 -type f -printf '%m %p\n'

      - name: Package deb and rpm
        if: env.SKIP != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*SoftFever_VERSION "\([^"]*\)".*/\1/p' version.inc | head -n1)
          [ -n "$VERSION" ] || { echo "::error::could not read version from version.inc"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          mkdir -p ../dist
          VERSION="$VERSION" /tmp/nfpm pkg -f ../nfpm.yaml -p deb -t ../dist/
          VERSION="$VERSION" /tmp/nfpm pkg -f ../nfpm.yaml -p rpm -t ../dist/
          ls -l ../dist

      - name: Verify packages
        if: env.SKIP != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm >/dev/null
          deb=$(ls ../dist/*.deb)
          rpmfile=$(ls ../dist/*.rpm)

          required="
          opt/OrcaSlicer/bin/orca-slicer
          opt/OrcaSlicer/orca-slicer
          opt/OrcaSlicer/resources
          usr/bin/orca-slicer
          usr/share/applications/com.orcaslicer.OrcaSlicer.desktop
          usr/share/metainfo/com.orcaslicer.OrcaSlicer.metainfo.xml
          "
          for size in $ICON_SIZES; do
            required="$required
          usr/share/icons/hicolor/${size}x${size}/apps/OrcaSlicer.png"
          done

          dpkg-deb -c "$deb" | awk '{print $6}' | sed -e 's|^\./||' -e 's|/$||' | sort -u > /tmp/deb-files
          rpm -qlp "$rpmfile" | sed -e 's|^/||' -e 's|/$||' | sort -u > /tmp/rpm-files

          fail=0
          for path in $required; do
            for list in /tmp/deb-files /tmp/rpm-files; do
              if ! grep -qx "$path" "$list"; then
                echo "::error::missing $path in $list"
                fail=1
              fi
            done
          done

          dpkg-deb -f "$deb" Depends
          rpm -qRp "$rpmfile"

          # installed as root:root, so the other-execute bit must survive packaging
          # (checked byte-for-byte: `test -x` passes for the owner/root even at 0754)
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          dpkg-deb -x "$deb" /tmp/stage
          root=/tmp/stage/opt/OrcaSlicer
          for path in ./opt/OrcaSlicer/orca-slicer ./opt/OrcaSlicer/libexec/orca-slicer-env ./opt/OrcaSlicer/bin/orca-slicer; do
            mode=$(dpkg-deb -c "$deb" | awk -v p="$path" '$6==p{print $1}')
            if [ "$mode" != "-rwxr-xr-x" ]; then
              echo "::error::${path#./} is '${mode}' in the deb, expected -rwxr-xr-x"
              fail=1
            fi
          done
          rpm_mode=$(rpm -qlvp "$rpmfile" | awk '$1 ~ /^-/ && $NF=="/opt/OrcaSlicer/orca-slicer"{print $1}')
          if [ "$rpm_mode" != "-rwxr-xr-x" ]; then
            echo "::error::rpm launcher mode is '${rpm_mode}', expected -rwxr-xr-x"
            fail=1
          fi

          # the AppDir bundle must cover every non-host library the binary needs
          LD_LIBRARY_PATH="$root/lib/orca-runtime:$root/lib:$root/bin" \
            ldd "$root/bin/orca-slicer" > /tmp/ldd.txt || true
          if [ ! -s /tmp/ldd.txt ]; then
            echo "::error::ldd produced no output for the packaged binary"
            exit 1
          fi
          while read -r lib; do
            [ -n "$lib" ] || continue
            if ! bash -c 'source scripts/appimage_lib_policy.sh; appimage_is_host_library "$1"' _ "$lib"; then
              echo "::error::$lib is neither bundled nor a declared host library"
              fail=1
            fi
          done < <(grep 'not found' /tmp/ldd.txt | awk '{print $1}')
          exit "$fail"

      - name: Smoke test the deb
        if: env.SKIP != 'true'
        working-directory: upstream
        # apt failing here means the declared Depends are not satisfiable on
        # Ubuntu 24.04. test -x runs as the unprivileged runner user, so a 0754
        # launcher (executable for root only) is caught — ldd does not catch it.
        run: |
          set -euo pipefail
          deb=$(ls ../dist/*.deb)
          sudo apt-get install -y "$GITHUB_WORKSPACE/dist/$(basename "$deb")"
          test -x /opt/OrcaSlicer/orca-slicer
          test -x /usr/bin/orca-slicer
          ls -l /opt/OrcaSlicer/orca-slicer
          timeout 90 orca-slicer --help > /tmp/help.log 2>&1 || true
          head -5 /tmp/help.log || true

      - name: Upload packages
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orca-slicer-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: Publish release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          if ! gh release view "$REF" >/dev/null 2>&1; then
            gh release create "$REF" --title "OrcaSlicer $VERSION (deb/rpm)" \
              --notes "Packages built from OrcaSlicer source \`$REF\` on Ubuntu 24.04 (glibc >= 2.39).

          Install:
            sudo apt install ./orca-slicer_${VERSION}-1_amd64.deb
            sudo dnf install ./orca-slicer-${VERSION}-1.x86_64.rpm

          Unofficial community packages — upstream ships AppImage and Flatpak only."
          fi
          gh release upload "$REF" dist/*.deb dist/*.rpm --clobber
